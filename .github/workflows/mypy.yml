name: Run python only mypy and unit tests

on:
  push:
  workflow_dispatch:

jobs:
  test-assemblyline:
    runs-on: ubuntu-latest
    name: Run python only mypy and unit tests
    steps:
      # Layout and field-label integration tests use Poppler, as docassemble does.
      - name: Install PDF layout tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftohtml -v
          pdftotext -v
      - uses: SuffolkLITLab/ALActions/pythontests@main
