---
metadata:
  temporary session: True
  sessions are unique: True
---
default screen parts:
  right: |
    % if user_has_privilege(['admin', 'developer']):
    ${ action_button_html(interview_url(i=f"{user_info().package}:menu.yml"), label="Back to Dashboard") }
    % endif
---
features:
  css:
    - docassemble.ALDashboard:data/static/heatmap.css
---
modules:
  - .aldashboard
---
mandatory: True
code: |
  session_list_mode
  if session_list_mode in ["browse", "search"]:
    load_answer
  elif session_list_mode == "session_id":
    view_single_session
  elif session_list_mode == "file_id":
    view_file_by_id
---
continue button field: playground_splash
id: splash screen
question: |
  Splash screen
---
code: |
  # get_allowed_interview_filenames() returns None for admins and developers,
  # who can see every interview, and otherwise the set of interviews listed
  # under `assembly line: interview viewers:` for the user's privileges.
  allowed_interview_filenames = get_allowed_interview_filenames()
  interviews = {
    interview["filename"]: interview
    for interview in interview_menu()
    if allowed_interview_filenames is None
    or interview["filename"] in allowed_interview_filenames
  }
---
code: |
  # Compute current interview usage and apply heatmap styles
  if user_has_privilege(["admin", "developer"]):
    current_interview_usage = dashboard_session_activity()
    current_usage_rows = make_usage_rows(
      current_interview_usage, nicer_interview_filename, limit=10
    )
    current_usage_rows = compute_heatmap_styles(current_usage_rows)
  else:
    current_usage_rows = []
---
code: |
  # Used to decide whether it's safe to load every user into the dropdown below, 
  # or whether the server has too many users for that
  if user_has_privilege(["admin", "developer"]):
    total_user_count = get_user_count()
  else:
    total_user_count = 0
---
id: select interview
question: |
  What interview do you want to view sessions for?
subquestion: |
  % if user_has_privilege(['admin', 'developer']):
  Pick an interview from the list below, or type a filename like: `docassemble.playground1:data/questions/interview.yml`
  % else:
  You can only view sessions for interviews you have access to.
  % endif
under: |
  % if user_has_privilege(['admin', 'developer']):
  % if current_usage_rows:
  <h2 class="h4">Current Interview Usage</h2>
  <table class="table table-sm table-striped">
    <thead>
      <tr>
        <th>Interview</th>
        <th class="text-center">1m</th>
        <th class="text-center">5m</th>
        <th class="text-center">10m</th>
        <th class="text-center">30m</th>
        <th class="text-center">60m</th>
        <th class="text-center">120m</th>
        <th class="text-center">Users</th>
      </tr>
    </thead>
        <tbody>
        % for r in current_usage_rows:
          <tr>
            <td><a href="${ url_action("set_interview_to_browse", filename=r['filename']) }">${ r['title'] }</a></td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_1','') }">${ r['s_1'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_5','') }">${ r['s_5'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_10','') }">${ r['s_10'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_30','') }">${ r['s_30'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_60','') }">${ r['s_60'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_120','') }">${ r['s_120'] }</td>
            <td class="text-center heat-cell" style="${ r.get('style_attr_users','') }">${ r['users'] }</td>
          </tr>
        % endfor
        </tbody>
  </table>
  % else:
  <div class="alert alert-secondary">Nobody is using the server right now (no sessions started in last 120 minutes).</div>
  % endif
  % endif
fields:
  - Mode: session_list_mode
    datatype: radio
    choices:
      - Browse recent sessions: browse
      - Search answer values: search
      - Look up specific session ID: session_id
      - Look up file number: file_id
    default: browse
  - Session ID: session_id
    required: False
    js show if: |
      val("session_list_mode") == "session_id"
  - File number: file_id_lookup
    datatype: integer
    required: False
    min: 1
    js show if: |
      val("session_list_mode") == "file_id"
  - Filename: filename
    required: False
    datatype: combobox
    code: |
      sorted(
        list(interviews.keys()),
        key=lambda fname: (
          interviews.get(fname).get("title")
          if isinstance(interviews.get(fname), dict)
          else (
            getattr(interviews.get(fname), "title", None)
            or (
              interviews.get(fname)
              if isinstance(interviews.get(fname), str)
              else fname
            )
          )
        ),
      )
    js show if: |
      ["browse", "search"].includes(val("session_list_mode"))
    show if:
      code: |
        user_has_privilege(['admin', 'developer'])
  - Filename: filename
    code: |
      sorted(
        list(interviews.keys()),
        key=lambda fname: (
          interviews.get(fname).get("title")
          if isinstance(interviews.get(fname), dict)
          else (
            getattr(interviews.get(fname), "title", None)
            or (
              interviews.get(fname)
              if isinstance(interviews.get(fname), str)
              else fname
            )
          )
        ),
      )
    js show if: |
      ["browse", "search"].includes(val("session_list_mode"))
    show if:
      code: |
        not user_has_privilege(['admin', 'developer'])
  - User (leave blank to view all sessions): chosen_user
    required: False
    datatype: integer
    input type: combobox
    js show if: |
      ["browse", "search"].includes(val("session_list_mode"))
    show if:
      code: |
        total_user_count <= 10000
    code: |
      (
        speedy_get_users()
        if user_has_privilege(["admin", "developer"])
        else [{user_info().id: user_info().email}]
      )
  - User (leave blank to view all sessions): chosen_user
    required: False
    input type: ajax
    action: user_search_ajax
    js show if: |
      ["browse", "search"].includes(val("session_list_mode"))
    show if:
      code: |
        total_user_count > 10000
  - Filter out interviews that are on the first page: filter_step1
    required: False
    datatype: yesno
    default: True
    js show if: |
      ["browse", "search"].includes(val("session_list_mode"))
  - Use advanced answer-variable filters: session_search_use_advanced_filters
    datatype: yesno
    default: False
    js show if: |
      val("session_list_mode") == "search"
  - Variable name: session_search_variable_name
    js show if: |
      val("session_list_mode") == "search" && !val("session_search_use_advanced_filters")
  - Value contains: session_search_variable_value
    js show if: |
      val("session_list_mode") == "search" && !val("session_search_use_advanced_filters")
  - note: |
      **Answer-variable filter syntax:** enter one filter per line as
      `variable = partial text`. Do not quote the partial text. Quote dictionary
      keys inside a variable path, for example:

      `legalserver_data["case_number"] = 12345`

      `clients[0].name.last = Smith`
    js show if: |
      val("session_list_mode") == "search" && val("session_search_use_advanced_filters")
  - Advanced filters: session_search_criteria_text
    datatype: area
    rows: 6
    required: False
    js show if: |
      val("session_list_mode") == "search" && val("session_search_use_advanced_filters")
  - Modified on or after: session_search_start_date
    datatype: date
    required: False
    js show if: |
      val("session_list_mode") == "search"
  - Modified on or before: session_search_end_date
    datatype: date
    required: False
    js show if: |
      val("session_list_mode") == "search"
validation code: |
  if session_list_mode == "session_id":
    if not str(session_id or "").strip():
      validation_error("Please enter a session ID.", field="session_id")
  elif session_list_mode == "file_id":
    if not str(file_id_lookup or "").strip():
      validation_error("Please enter a file number.", field="file_id_lookup")
  elif session_list_mode == "search":
    if session_search_use_advanced_filters:
      session_search_resolved_criteria_text = build_session_search_criteria_text(
        "",
        "",
        use_advanced_filters=True,
        advanced_criteria_text=session_search_criteria_text,
      )
    else:
      session_search_resolved_criteria_text = build_session_search_criteria_text(
        session_search_variable_name,
        session_search_variable_value,
      )
    try:
      parse_session_search_criteria(session_search_resolved_criteria_text)
    except SessionSearchCriteriaError as error:
      validation_error(
        str(error),
        field="session_search_criteria_text" if session_search_use_advanced_filters else "session_search_variable_name",
      )
  else:
    session_search_resolved_criteria_text = ""
    session_search_start_date = None
    session_search_end_date = None
---
# next((item.get('title') for item in interviews if item.get('filename') == interview['filename']), interview['filename'] )
code: |
  # chosen_user comes back as a string from the ajax field (large servers),
  # but as a real int from the combobox (small servers) - normalize it here so speedy_get_sessions() 
  # always gets a proper int either way
  if total_user_count > 10000 and chosen_user:
    chosen_user = int(chosen_user)
---
code: |
  # Retrieve sessions once to render the browse/search table.
  sessions_list = speedy_get_sessions(
    user_id=chosen_user if session_list_mode in ["browse", "search"] else None,
    filename=filename if session_list_mode in ["browse", "search"] else None,
    filter_step1=filter_step1 if session_list_mode in ["browse", "search"] else False,
    start_date=session_search_start_date if session_list_mode == "search" else None,
    end_date=session_search_end_date if session_list_mode == "search" else None,
    search_criteria_text=session_search_resolved_criteria_text if session_list_mode == "search" else "",
  )
---
need: sessions_list
code: |
  # Only look up the names of users who actually appear in the sessions
  # we're displaying, instead of loading every user on the server
  needed_user_ids = set()
  for interview in sessions_list:
    raw_user_ids = getattr(interview, "user_ids", None)
    if not raw_user_ids:
      raw_user_ids = getattr(interview, "user_id", None)
    if not raw_user_ids:
      continue
    if isinstance(raw_user_ids, str):
      needed_user_ids.update(raw_user_ids.split(","))
    elif isinstance(raw_user_ids, (list, tuple, set)):
      needed_user_ids.update(str(x) for x in raw_user_ids)
    else:
      needed_user_ids.add(str(raw_user_ids))

  clean_ids = []
  for uid in needed_user_ids:
    try:
      clean_ids.append(int(uid))
    except (TypeError, ValueError):
      continue

  users_and_name_dict = {
    user_id: f"{email} {name} {last}".strip()
    for user_id, email, name, last in get_users_and_name_by_ids(clean_ids)
  }
---
event: user_search_ajax
code: |
  # set_save_status('ignore') so this doesn't add a step to the interview every time a search happens
  set_save_status('ignore')
  original = action_argument('wordstart')
  # If the field is being redisplayed, docassemble sends the already-stored value (a user ID) instead of 
  # typed text look that single user up and return their label so it renders correctly, per the ajax field docs
  try:
    original_id = int(original)
    existing_match = get_users_and_name_by_ids([original_id])
    if existing_match:
      user_id, email, name, last = existing_match[0]
      json_response([[str(user_id), f"{email} {name} {last}".strip()]])
  except (TypeError, ValueError):
    pass
  results = [
    [str(user_id), label] for user_id, label in search_users_by_email(original)
  ]
  json_response(results)
---
event: set_interview_to_browse
code: |
  filename = action_argument("filename")
  chosen_user = None
  filter_step1 = True
  session_list_mode = "browse"
  session_search_resolved_criteria_text = ""
  session_search_start_date = None
  session_search_end_date = None
  undefine("sessions_list")
---
event: load_answer
id: session list
question: |
  % if filename:
  ${ "Matching" if session_list_mode == "search" else "Recently started" } sessions for ${ nicer_interview_filename(interviews.get(filename, {"title": filename}).get('title', filename)) }
  % elif chosen_user:
  ${ "Matching" if session_list_mode == "search" else "Recently started" } sessions for User ID ${ chosen_user }
  % else:
  ${ "Matching" if session_list_mode == "search" else "Recently started" } sessions for all users
  % endif
subquestion: |
  ${ action_button_html(url_action('go_to_session_id_lookup'), label='Find Session By ID') }

  <table class="table">
    <thead>
      <tr>
        <th>Title and session ID</th>
        <th>User</th>
        <th>Modified</th>
        <th>Step / Progress</th>
        <th>Actions</th>
      </tr>
    </thead>

  % for interview in sessions_list:
  <tr>
    <td class="text-wrap text-break">
      <strong>${ interview.title if interview.title else interview.auto_title }</strong>
      <br/>
      ${ interview.key }
  % if not filename:
      <br/>
      ${ nicer_interview_filename(interview.filename) }
  % endif
    </td>
    <td>${ format_session_users(interview, users_and_name_dict) }</td>
    <td>${ format_date(interview.modtime, "MMM d YYYY") }</td>
    <td>
      ${ f"Step {interview.num_keys if not interview.progress else (lambda x: f'{float(x):.2f}' if isinstance(x, (int, float, str)) and str(x).replace('.', '', 1).isdigit() else None)(interview.progress)}%"}
    </td>
    <td>
      <a href="${ interview_url(i=interview.filename, session=interview.key) }">
        <i class="fa-solid fa-folder-open"></i>&nbsp;Join</a>
    <br/>
    <a href="${ interview_url_action('view_single_session', session_id=interview.key) }"><i class="fa-solid fa-magnifying-glass"></i>&nbsp;Details</a>
    <br/>
    <a href="${ interview_url_action('view_session_variables', session_id=interview.key) }"><i class="fa-solid fa-eye"></i>&nbsp;Vars</a>
    <br/>
    <a href="${ interview_url_action('view_session_files', session_id=interview.key) }"><i class="fa-solid fa-paperclip"></i>&nbsp;Files</a>
  % if user_has_privilege('admin'):
    <br/>
    <a href="${ url_action('delete_session', session_id=interview.key, filename=interview.filename) }"><i class="fa-solid fa-trash"></i>&nbsp;Delete</a>
  % endif
    </td>
  </tr>
  % endfor
  </table>
back button: True
---
event: go_to_session_id_lookup
code: |
  session_list_mode = "session_id"
  undefine("session_id")
---
reconsider: True
code: |
  current_file_id = str(action_argument('file_id') or file_id_lookup or "").strip()
---
reconsider: True
code: |
  # This returns None for both missing files and files whose owning interview
  # the current user cannot inspect, to avoid exposing sequential file IDs.
  permitted_upload_details = get_permitted_upload_details(current_file_id)
---
event: view_file_by_id
id: view file by id
question: |
  % if permitted_upload_details:
  File #${ permitted_upload_details.get('file_id') }
  % else:
  File #${ current_file_id } not found
  % endif
subquestion: |
  % if permitted_upload_details:
  <% file_session = permitted_upload_details['session'] %>
  <table class="table">
    <tbody>
      <tr><th scope="row">Filename</th><td class="text-wrap text-break">${ permitted_upload_details.get('filename') or 'Unknown' }</td></tr>
      <tr><th scope="row">Interview</th><td class="text-wrap text-break">${ file_session.get('filename') or permitted_upload_details.get('yamlfile') }</td></tr>
      <tr><th scope="row">Session</th><td class="text-wrap text-break">${ permitted_upload_details.get('key') }</td></tr>
      <tr><th scope="row">User</th><td>${ format_session_users(file_session, {}) }</td></tr>
      <tr><th scope="row">Modified</th><td>${ format_date(file_session.get('modtime'), "MMM d YYYY") }</td></tr>
    </tbody>
  </table>

  <a class="btn btn-primary" href="${ interview_url_action('download_file_number', file_id=permitted_upload_details.get('file_id')) }">
    <i class="fa-solid fa-download"></i>&nbsp;Download</a>
  <a class="btn btn-secondary" href="${ interview_url_action('view_single_session', session_id=permitted_upload_details.get('key')) }">
    <i class="fa-solid fa-magnifying-glass"></i>&nbsp;View session</a>
  % else:
  <div class="alert alert-warning">No file found with number <code>${ current_file_id }</code>, or you do not have permission to view its session.</div>
  % endif
back button: True
---
# Recomputed on every screen so that following a "Details" link for one session
# doesn't redisplay the session that was looked at before it.
reconsider: True
code: |
  current_session_id = str(action_argument('session_id') or session_id or "").strip()
---
reconsider: True
code: |
  # None both when no such session exists and when this user isn't allowed to
  # see it, so the screens below can't be used to browse other people's sessions.
  single_session_details = get_permitted_session_details(current_session_id)
---
reconsider: True
code: |
  if single_session_details:
    single_session_files = get_files_associated_with_session(
      current_session_id,
      yaml_filename=single_session_details.get('filename'),
      privileged=user_has_privilege(['admin', 'developer'])
    )
  else:
    single_session_files = []
---
event: view_single_session
id: view single session
question: |
  % if single_session_details:
  Session details for ${ single_session_details.get('title') or single_session_details.get("auto_title") or current_session_id }
  % else:
  Session ${ current_session_id } not found
  % endif
subquestion: |
  % if single_session_details:
  <table class="table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Session ID</th>
        <th>User</th>
        <th>Modified</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tr>
      <td class="text-wrap text-break">
        <strong>${ single_session_details.get('title') or single_session_details.get("auto_title") or current_session_id }</strong>
        % if single_session_details.get('filename'):
        <br/>
        ${ nicer_interview_filename(single_session_details.get('filename')) }
        % endif
      </td>
      <td>${ current_session_id }</td>
      <td>${ format_session_users(single_session_details, {}) }</td>
      <td>${ format_date(single_session_details.get('modtime'), "MMM d YYYY") }</td>
      <td>
        <a href="${ interview_url(i=single_session_details['filename'], session=current_session_id) }">
          <i class="fa-solid fa-folder-open"></i>&nbsp;Join</a>
        <br/>
        <a href="${ interview_url_action('view_session_variables', session_id=current_session_id) }">
          <i class="fa-solid fa-eye"></i>&nbsp;Vars</a>
        <br/>
        <a href="${ interview_url_action('view_session_files', session_id=current_session_id) }">
          <i class="fa-solid fa-paperclip"></i>&nbsp;Files (${ len(single_session_files) })</a>
        % if user_has_privilege('admin'):
        <br/>
        <a href="${ url_action('delete_session', session_id=current_session_id, filename=single_session_details.get('filename')) }">
          <i class="fa-solid fa-trash"></i>&nbsp;Delete</a>
        % endif
      </td>
    </tr>
  </table>

  % if single_session_files:
  <h2 class="h5 mt-4">Files for this session</h2>
  <table class="table table-sm">
    <thead>
      <tr>
        <th>File ID</th>
        <th>Filename</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      % for f in single_session_files:
      <tr>
        <td>${ f.get('file_id') }</td>
        <td class="text-wrap text-break">${ f.get('filename') }</td>
        <td>
          <a href="${ interview_url_action('download_session_file', session_id=current_session_id, file_id=f.get('file_id')) }">
            <i class="fa-solid fa-download"></i>&nbsp;Download</a>
        </td>
      </tr>
      % endfor
    </tbody>
  </table>
  <a href="${ interview_url_action('download_all_session_files', session_id=current_session_id) }">
    <i class="fa-solid fa-file-zipper"></i>&nbsp;Download all files (.zip)</a>
  % else:
  <div class="alert alert-secondary mt-3">No files are associated with this session.</div>
  % endif

  % else:
  <div class="alert alert-warning">No session found with ID: <code>${ current_session_id }</code>, or you do not have permission to view it.</div>
  % endif
back button: True
---
event: view_session_files
id: view session files
question: |
  Files for session ${ current_session_id }
subquestion: |
  % if not single_session_details:
  <div class="alert alert-warning">No session found with ID: <code>${ current_session_id }</code>, or you do not have permission to view it.</div>
  % elif single_session_files:
  <table class="table">
    <thead>
      <tr>
        <th>File ID</th>
        <th>Filename</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
    % for f in single_session_files:
      <tr>
        <td>${ f.get('file_id') }</td>
        <td class="text-wrap text-break">${ f.get('filename') }</td>
        <td>
          <a href="${ interview_url_action('download_session_file', session_id=current_session_id, file_id=f.get('file_id')) }">
            <i class="fa-solid fa-download"></i>&nbsp;Download</a>
        </td>
      </tr>
    % endfor
    </tbody>
  </table>
  <a href="${ interview_url_action('download_all_session_files', session_id=current_session_id) }">
    <i class="fa-solid fa-file-zipper"></i>&nbsp;Download all files (.zip)</a>
  % else:
  <div class="alert alert-secondary">No files are associated with this session.</div>
  % endif
back button: True
---
event: view_session_variables
code: |
  session_details_for_variables = get_permitted_session_details(action_argument("session_id"))
  if not session_details_for_variables:
    response(response="Session not found.", response_code=404, content_type="text/plain; charset=utf-8")
  json_response(
    dashboard_get_session_variables(
      session_id=action_argument("session_id"),
      filename=session_details_for_variables.get("filename"),
    )
  )
---
event: download_session_file
code: |
  session_details_for_download = get_permitted_session_details(action_argument('session_id'))
  if not session_details_for_download:
    response(response="File not found for this session.", response_code=404, content_type="text/plain; charset=utf-8")
  # Serving a DAFile rather than raw bytes gives the download its real filename.
  file_to_download = get_session_file_for_download(
    action_argument('session_id'),
    action_argument('file_id'),
    yaml_filename=session_details_for_download.get('filename'),
    privileged=user_has_privilege(['admin', 'developer'])
  )
  if not file_to_download:
    response(response="File not found for this session.", response_code=404, content_type="text/plain; charset=utf-8")
  response(file=file_to_download)
---
event: download_file_number
code: |
  # Re-resolve both ownership and authorization instead of trusting values from
  # the result page or serving a guessed file number directly.
  upload_for_download = get_permitted_upload_details(action_argument('file_id'))
  if not upload_for_download:
    response(response="File not found.", response_code=404, content_type="text/plain; charset=utf-8")
  owning_session = upload_for_download['session']
  file_from_number = get_session_file_for_download(
    upload_for_download['key'],
    upload_for_download['file_id'],
    yaml_filename=owning_session.get('filename'),
    privileged=user_has_privilege(['admin', 'developer'])
  )
  if not file_from_number:
    response(response="File not found.", response_code=404, content_type="text/plain; charset=utf-8")
  response(file=file_from_number)
---
event: download_all_session_files
code: |
  session_details_for_zip = get_permitted_session_details(action_argument('session_id'))
  if not session_details_for_zip:
    response(response="No files found for this session.", response_code=404, content_type="text/plain; charset=utf-8")
  session_files_zip = get_session_files_zip(
    action_argument('session_id'),
    yaml_filename=session_details_for_zip.get('filename'),
    privileged=user_has_privilege(['admin', 'developer'])
  )
  if not session_files_zip:
    response(response="No files found for this session.", response_code=404, content_type="text/plain; charset=utf-8")
  response(file=session_files_zip)
---
event: delete_session
code: |
  if not user_has_privilege('admin'):
    log("You do not have permission to delete this session.", "danger")
  elif interview_list(
    action="delete",
    filename=action_argument("filename"),
    session=action_argument("session_id"),
    user_id="all",
    delete_shared=True,
  ):
    log("Deleted session", "success")
  else:
    log("Something went wrong deleting session", "danger")
