      <tr>
        <td>${ f.get('file_id') }</td>
        <td class="text-wrap text-break">${ f.get('filename') }</td>
        <td>
          <a href="${ interview_url_action('download_session_file', session_id=current_session_id, filename=single_session_details.get('filename'), file_id=f.get('file_id')) }">
            <i class="fa-solid fa-download"></i>&nbsp;Download</a>
        </td>
      </tr>
      % endfor
