  </table>
  <a href="${ interview_url_action('download_all_session_files', session_id=current_session_id, filename=single_session_details.get('filename')) }">
    <i class="fa-solid fa-file-zipper"></i>&nbsp;Download all files (.zip)</a>
  % else:
  <div class="alert alert-secondary mt-3">No uploaded files are associated with this session.</div>
  % endif

  % else:
  <div class="alert alert-warning">No session found with ID: <code>${ current_session_id }</code></div>
  % endif
back button: True
---
